name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install flask gunicorn

      - name: 安装 ffmpeg（用于生成测试音频）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 规则引擎测试
        run: python3 tests/test_rules.py

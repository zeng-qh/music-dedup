services:
  music-dedup:
    build: .
    image: ghcr.io/zeng-qh/music-dedup:latest
    container_name: music-dedup
    ports:
      - "8321:8321"
    volumes:
      - /你的音乐目录:/music          # ← 改成飞牛里音乐的实际路径
    environment:
      - MUSIC_ROOT=/music
    # 内存限制：Pi 4B 视版本 1G~8G，按需调整；超限时容器会以退出码 137 结束
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8321/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
